# yaml-language-server: $schema=../vendor/symfony/routing/Loader/schema/routing.schema.json

root:
    path: '/'
    controller: App\Controller\HomeController::root

admin:
    path: /team
    controller: App\Admin\Controller\DashboardController::index

controllers:
    resource:
        path: ../src/Controller/
        namespace: App\Controller
    type: attribute
    prefix: '/{_locale<en|fr|es|de>}'
    defaults:
        _locale: 'en'

# The admin, in its own folder so that the import above never sees it, is not locale-prefixed: every route of
# src/Admin lives under /team, where security.yaml's access_control applies, and is named admin_*.
# scripts/check-admin-routes.php enforces both in CI.
admin_controllers:
    resource:
        path: ../src/Admin/Controller/
        namespace: App\Admin\Controller
    type: attribute
    prefix: '/team'
    name_prefix: 'admin_'

logout:
    path: '/{_locale<en|fr|es|de>}/logout'
    controller: App\Controller\ConnectController::logout

connect_google_start:
    path: '/connect/google'
    controller: App\Controller\ConnectController::connectGoogleStart

connect_google_check:
    path: '/connect/google/check'
    controller: App\Controller\ConnectController::connectGoogleCheck

login_check:
    path: '/{_locale<en|fr|es|de>}/login/check'
