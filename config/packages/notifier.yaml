framework:
    notifier:
        chatter_transports:
            discord_notif: '%env(DISCORD_NOTIF_DSN)%'
            discord_log: '%env(DISCORD_LOG_DSN)%'
            discord_picture: '%env(DISCORD_PICTURE_DSN)%'
            discord_report: '%env(DISCORD_REPORT_DSN)%'
        channel_policy:
            # channel_policy only used  by monolog at this time
            # need to improve the monolog transport logic
            urgent: ['chat/discord_log']
            high: ['chat/discord_log']
            medium: []
            low: []

# Chatter listeners (e.g. ReviewReportListener) fire unconditionally on entity
# persist. Fixtures and tests must never be able to reach real Discord
# webhooks, even if a real DSN ends up in a local .env.local.
when@dev:
    framework:
        notifier:
            chatter_transports:
                discord_notif: 'null://null'
                discord_log: 'null://null'
                discord_picture: 'null://null'
                discord_report: 'null://null'

when@test:
    framework:
        notifier:
            chatter_transports:
                discord_notif: 'null://null'
                discord_log: 'null://null'
                discord_picture: 'null://null'
                discord_report: 'null://null'
