ux_translator:
    # Only include messages domain (exclude validators, security, etc.)
    domains: ['messages', 'database']
    # Every JS trans() call site is grep-able (assets/controllers/search_controller.js,
    # review_actions_controller.js) -- keep this list in sync with those, not
    # broader. `country.*` covers search_controller.js's one dynamic-key call
    # (trans(country, {}, 'database')), which can't be listed literally.
    keys_patterns:
        - 'app.search.searching'
        - 'search_index.noResult'
        - 'search_index.more'
        - 'review.report_success'
        - 'review.report_error'
        - 'review.submit_report'
        - 'review.remove_upvote'
        - 'review.upvote'
        - 'country.*'
