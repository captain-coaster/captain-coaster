# Full configuration reference: https://symfony.com/bundles/ux-icons/current/index.html#configuration
ux_icons:
    # Default HTML attributes to add to all icons
    default_icon_attributes:
        # Use current text color to fill the icon
        fill: currentColor
        # Default dimensions for better text alignment
        height: '1em'
        width: '1em'

    icon_sets:
        # Lucide is the app's icon set (DESIGN.md, Iconography). Its shapes
        # inherit stroke and fill from the <svg> (base.css), so these defaults
        # and per-call overrides reach the drawing: `fill: 'currentColor'`
        # draws the filled state (rated star, voted thumb).
        lucide:
            icon_attributes:
                fill: none
                stroke-width: '1.75'
                data-icon-set: lucide

    # Throw an exception if an icon is not found
    ignore_not_found: false

when@prod:
    ux_icons:
        # Suppress exceptions for missing icons in production
        ignore_not_found: true
