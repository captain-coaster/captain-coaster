framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async: '%env(MESSENGER_TRANSPORT_DSN)%'
            # Failures are rare and worth inspecting via SQL/Adminer, unlike the
            # broadcast-volume async transport above — Doctrine fits here even
            # though it was ruled out for that one.
            failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        routing:
            App\Message\SendNotificationEmailMessage: async
            App\Message\AnalyzeImageMessage: async
            # Discord: a request no longer waits for it, and the webhook URL stays out of the
            # request's log buffer. Its own failures are kept off Discord (SkipChatFailuresHandler).
            Symfony\Component\Notifier\Message\ChatMessage: async

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
