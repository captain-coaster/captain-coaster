# Admin validators
date_minimum:
    error: "El año debe ser 1800 o posterior."

# Blocked words in reviews
blocked_words:
    review: 'Su reseña contiene términos que no están permitidos. Por favor, reformule su reseña.'
# Ride date validation
ride_date:
