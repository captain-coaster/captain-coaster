# Admin validators
date_minimum:
    error: "Das Jahr muss 1800 oder später sein."

# Blocked words in reviews
blocked_words:
    review: 'Deine Bewertung enthält nicht erlaubte Ausdrücke. Bitte formuliere sie um.'
# Ride date validation
ride_date:
    before_opening: Das Fahrdatum kann nicht vor der Eröffnung der Achterbahn liegen.
    after_closing: Das Fahrdatum kann nicht nach der Schließung der Achterbahn liegen.
    future: Das Fahrdatum kann nicht in der Zukunft liegen.
    invalid: Dieses Fahrdatum ist ungültig.

# Image upload validation
image_upload:
    form:
        copyright_agreement:
            required: 'Du musst bestätigen, dass du die Rechte zum Hochladen dieses Fotos hast.'

star_rating:
    required: 'Wähle eine Anzahl Sterne.'

# Cloudflare Turnstile (overrides the bundle's message)
invalid_turnstile: "Die Bot-Prüfung wurde nicht abgeschlossen. Warte ein paar Sekunden und sende das Formular erneut."
