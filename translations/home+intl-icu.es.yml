    ridden: '{count, plural, one {coaster montada} other {coasters montadas}}'
    year: 'en {year}'
    reviews: '{count, plural, one {reseña} other {reseñas}}'

panel:
    title: 'Tu panel'

starter:
    title: 'Empieza a registrar tus coasters'
