title: 'Descubre, califica y comparte montañas rusas'
description: 'Guía participativa para descubrir, calificar y revisar montañas rusas. Encuentra todas las mejores montañas rusas con nuestra clasificación y mapa interactivo.'
tagline: 'Descubre tu próxima coaster favorita.'

hero:
    new: 'Recién inaugurada'
    photo: 'Foto de un miembro'
    credit: 'Foto:'

