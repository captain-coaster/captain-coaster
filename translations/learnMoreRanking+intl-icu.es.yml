title: '¿Cómo funciona la clasificación?'
brief:
    title: 'La clasificación de Captain Coaster en breve'
    text:
        '<p>La clasificación de Captain Coaster se basa en un sistema de <b>comparación por pares</b>. Estas comparaciones se derivan de sus Tops y Calificaciones, ¡cuanto más detalladas sean, mejor será la clasificación!</p>
        <p>El Top es más preciso, mientras que las calificaciones son más rápidas de dar. Para maximizar su influencia en la clasificación, le recomendamos <b>calificar todas sus montañas rusas montadas</b>, y luego <b>clasificar sus montañas rusas mejor calificadas</b> en su Top.</p>'
principles:
    title: 'Los principios de la clasificación'
    text:
        '<p><b>Para cada montaña rusa de la clasificación, calculamos un duelo contra cada otra montaña rusa</b> de la base de datos para determinar cuál es la mejor.</p>
        <p>Solo los riders que hayan probado ambas montañas rusas pueden contribuir a este duelo. Esta comparación proviene de las calificaciones o del Top si ambas montañas rusas aparecen en él. <b>El duelo lo gana la montaña rusa que obtuvo la mayoría de comparaciones favorables.</b><br/>Los resultados de todos estos duelos se combinan para establecer la clasificación final. Si una montaña rusa gana todos sus duelos, será la primera. Otra que solo pierde contra el #1 pero gana a todas las demás será #2, y así sucesivamente. La puntuación refleja esta proporción de duelos ganados.</p>
        <p>El algoritmo está diseñado para <b>reflejar las verdaderas preferencias y gustos de todos los riders participantes</b>.<br/>No hay efecto de masas: el número total de calificaciones de una montaña rusa no tiene ninguna influencia. ¡No es un concurso de popularidad! Las montañas rusas raras tienen tantas posibilidades de estar bien clasificadas como las más populares.</p>
        <p>Para su información: calificar una sola montaña rusa genera 0 comparaciones, es decir, ninguna influencia. Calificar 10 montañas rusas genera 45 comparaciones, calificar 20 montañas rusas genera 190 comparaciones, y así sucesivamente.</p>
        <p>Cuanto más monte y califique montañas rusas, más comparaciones aporta, ¡y más crece su influencia en la clasificación! Esto le anima a calificar todas sus montañas rusas montadas y a seguir montando cada vez más.</p>
        <p>Tenga en cuenta que <b>una sola persona no puede alterar toda la clasificación</b>. Todo el mundo tiene una influencia, pero una sola persona con una opinión contraria sobre una montaña rusa no cambiará radicalmente su puntuación: siempre prevalece el punto de vista mayoritario.</p>'
