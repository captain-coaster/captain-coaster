learn_more:
    title: 'Alles zum Ranking'
    brief:
        title: 'Das Captain Coaster Ranking in Kürze'
        text:
            '<p>Das Ranking von Captain Coaster basiert auf einem <b>paarweisen Vergleichssystem</b>. Die Vergleiche werden aus deinen Tops und Bewertungen abgeleitet — je detaillierter sie sind, desto besser!</p>
            <p>Tops sind präziser, während Bewertungen schneller zu vergeben sind. Um deinen Einfluss auf das Ranking zu maximieren, empfehlen wir dir, <b>alle deine gefahrenen Achterbahnen zu bewerten</b> und dann <b>deine bestbewerteten Achterbahnen</b> in deinem Top zu ordnen.</p>'
    duel:
        title: 'Ein echtes Duell'
        caption: 'Platz {first} gegen Platz {second}, Ranking {month}'
        riders: '{count, plural, one {# Fahrer ist beide gefahren.} other {# Fahrer sind beide gefahren.}}'
        winner: '{name} gewinnt dieses Duell.'
        expected: 'Ein Duell unter Tausenden: Erst alle gewonnenen Duelle zusammen bestimmen den Platz im Ranking.'
        ties: 'Die Vergleiche stammen aus Tops und Bewertungen. Zwei gleiche Bewertungen zählen je zur Hälfte.'
    principles:
        title: 'Ranking-Prinzipien'
        duels:
            title: 'Jede Achterbahn tritt gegen jede andere an.'
            text: 'Für jede Achterbahn im Ranking berechnen wir ein direktes Duell gegen jede andere Achterbahn in der Datenbank, um zu ermitteln, welche besser ist. Die Ergebnisse aller Duelle werden dann kombiniert: Eine Achterbahn, die alle ihre Duelle gewinnt, belegt Platz 1, eine, die nur gegen die Nr. 1 verliert, aber alle anderen schlägt, wird Nr. 2, und so weiter. Der Score spiegelt dieses Verhältnis gewonnener Duelle wider.'
        riders:
            title: 'Nur wer beide gefahren ist, stimmt ab.'
            text: 'Nur Fahrer, die beide Achterbahnen erlebt haben, können zu einem Duell beitragen. Der Vergleich stammt aus deinem Top, wenn beide darin stehen, sonst aus deinen Bewertungen. Das Duell gewinnt die Achterbahn mit der Mehrheit der positiven Vergleiche: So spiegelt das Ranking die echten Vorlieben aller Fahrer wider.'
        mass:
            title: 'Kein Masseneffekt.'
            text: 'Die Gesamtzahl der Bewertungen einer Achterbahn hat keinen Einfluss. Das ist kein Beliebtheitswettbewerb: Seltene Achterbahnen haben die gleichen Chancen auf eine gute Platzierung wie die beliebtesten.'
        influence:
            title: 'Je mehr du bewertest, desto mehr zählst du.'
            text: 'Die Bewertung von nur einer Achterbahn erzeugt keinen Vergleich. 10 Bewertungen erzeugen 45 Vergleiche, 20 erzeugen 190, und so weiter. Je mehr Achterbahnen du fährst und bewertest, desto größer ist dein Einfluss auf das Ranking: Bewerte alle deine gefahrenen Achterbahnen und fahr immer mehr!'
        majority:
            title: 'Niemand kann alles umwerfen.'
            text: 'Jeder hat Einfluss, aber eine Person mit einer gegensätzlichen Meinung zu einer Achterbahn wird deren Score nicht drastisch verändern: Die Mehrheitsmeinung setzt sich immer durch.'
        yours: 'Deine {ratings, number} Bewertungen ergeben {comparisons, number} Vergleiche.'
        yours_top: 'Deine {ratings, number} Bewertungen und die {top, number} Achterbahnen in deinem Top ergeben {comparisons, number} Vergleiche.'
