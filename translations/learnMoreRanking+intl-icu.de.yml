title: 'Wie funktioniert das Ranking?'
brief:
    title: 'Das Captain Coaster Ranking in Kürze'
    text:
        '<p>Das Captain Coaster Ranking basiert auf einem <b>paarweisen Vergleichssystem</b>. Diese Vergleiche werden aus deinen Tops und Bewertungen abgeleitet — je detaillierter, desto besser das Ranking!</p>
        <p>Das Top ist präziser, während Bewertungen schneller abgegeben werden. Um deinen Einfluss auf das Ranking zu maximieren, empfehlen wir dir, <b>alle Coaster, die du gefahren bist, zu bewerten</b>, und dann <b>deine bestbewerteten Coaster</b> in deinem Top zu platzieren.</p>'
principles:
    title: 'Die Prinzipien des Rankings'
    text:
        '<p><b>Für jeden Coaster im Ranking berechnen wir ein Duell gegen jeden anderen Coaster</b> in der Datenbank, um zu bestimmen, welcher der bessere ist.</p>
        <p>Nur Rider, die beide Coaster gefahren haben, können zu diesem Duell beitragen. Dieser Vergleich stammt aus den Bewertungen oder aus dem Top, wenn beide Coaster darin vorkommen. <b>Das Duell wird von dem Coaster gewonnen, der die Mehrheit der günstigen Vergleiche erhalten hat.</b><br/>Die Ergebnisse all dieser Duelle werden dann kombiniert, um das endgültige Ranking zu erstellen. Wenn ein Coaster alle seine Duelle gewinnt, wird er Erster. Ein anderer, der nur gegen Nr. 1 verliert, aber alle anderen schlägt, wird Nr. 2, und so weiter. Der Score spiegelt diesen Anteil gewonnener Duelle wider.</p>
        <p>Der Algorithmus ist darauf ausgelegt, <b>die wahren Vorlieben und Geschmäcker aller teilnehmenden Rider widerzuspiegeln</b>.<br/>Es gibt keinen Masseneffekt: Die Gesamtzahl der Bewertungen eines Coasters hat keinen Einfluss. Das ist kein Beliebtheitswettbewerb! Seltene Coaster haben genauso gute Chancen, gut platziert zu werden, wie die beliebtesten.</p>
        <p>Zur Information: Einen einzelnen Coaster zu bewerten erzeugt 0 Vergleiche, also keinen Einfluss. 10 Coaster zu bewerten erzeugt 45 Vergleiche, 20 erzeugt 190 Vergleiche, und so weiter.</p>
        <p>Je mehr du fährst und bewertest, desto mehr Vergleiche bringst du ein — und desto mehr wächst dein Einfluss auf das Ranking. Das ermutigt dich, alle deine gefahrenen Coaster zu bewerten und immer mehr zu fahren!</p>
        <p>Beachte, dass <b>eine einzelne Person nicht das gesamte Ranking durcheinanderbringen kann</b>. Jeder hat einen Einfluss, aber eine einzelne Person mit einer gegenteiligen Meinung zu einem Coaster wird seinen Score nicht radikal ändern — es ist immer die Mehrheitsmeinung, die gewinnt.</p>'
