top_coaster.duplicate: '{coaster} est présent plusieurs fois. Retire les doublons.'

# Admin validators
date_minimum:
    error: "L'année doit être 1800 ou plus."

# Blocked words in reviews
blocked_words:
    review: "Ton avis contient des termes non autorisés. Reformule-le."
# Ride date validation
ride_date:
    before_opening: La date du ride ne peut pas être antérieure à l'ouverture du coaster.
    after_closing: La date du ride ne peut pas être postérieure à la fermeture du coaster.
    future: La date du ride ne peut pas être dans le futur.

# Image upload validation
image_upload:
    form:
        copyright_agreement:
            required: 'Tu dois confirmer que tu as les droits pour envoyer cette photo.'

star_rating:
    required: 'Choisis un nombre d''étoiles.'

# Cloudflare Turnstile (overrides the bundle's message)
invalid_turnstile: "La vérification anti-robot n'a pas abouti. Attends quelques secondes, puis renvoie le formulaire."
