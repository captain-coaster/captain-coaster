top_coaster.duplicate: '{coaster} appears several times. Please remove duplicates.'

# Admin validators
date_minimum:
    error: Year must be at least 1800.

# Blocked words in reviews
# Ride date validation
ride_date:
    before_opening: The ride date cannot be before the coaster opened.
    after_closing: The ride date cannot be after the coaster closed.
    future: The ride date cannot be in the future.
    invalid: This is not a valid ride date.

# Image upload validation
image_upload:
    form:
        copyright_agreement:
            required: 'You must confirm that you have the rights to upload this photo.'

star_rating:
    required: 'Choose how many stars.'

# Cloudflare Turnstile (overrides the bundle's message)
invalid_turnstile: "The anti-bot check didn't complete. Wait a few seconds, then send the form again."

# Heavy profanity in a review (BlockedWordList)
blocked_words:
    review: "Your review contains “{word}”, which isn't allowed here. Rephrase it without that word."
