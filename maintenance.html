<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quick Technical Stop! • Captain Coaster</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <style>
        :root { color-scheme: light dark; }

        body {
            background: linear-gradient(180deg, #bde3fb 0%, #e8f6ff 55%, #ffffff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            margin: 0;
            padding: 24px;
        }

        .card {
            background: #ffffff;
            border-radius: 24px;
            padding: 44px 40px 36px;
            text-align: center;
            max-width: 460px;
            width: 100%;
            box-shadow: 0 24px 60px rgba(3, 105, 161, 0.18);
        }

        .logo { width: 44px; height: auto; display: block; margin: 0 auto 18px; }

        .track { width: 100%; height: 96px; display: block; margin-bottom: 4px; }

        .rail {
            fill: none;
            stroke: #039BE5;
            stroke-width: 5;
            stroke-linecap: round;
        }

        .cart {
            offset-path: path('M8,92 C60,18 118,18 168,80 C205,124 245,124 282,72 C312,32 344,32 372,58');
            offset-rotate: 0deg;
            animation: ride 3.4s ease-in-out infinite alternate;
        }

        .cart circle:first-child { fill: #FF9800; }
        .cart circle:nth-child(2), .cart circle:nth-child(3) { fill: #12233d; }

        @keyframes ride {
            0%   { offset-distance: 0%; }
            100% { offset-distance: 100%; }
        }

        .title { font-size: 26px; font-weight: 700; color: #12233d; margin: 8px 0 14px; }
        .message { font-size: 16px; line-height: 1.55; color: #55647a; margin: 0 0 6px; }
        .footer { color: #9aa7bd; font-size: 13px; margin-top: 26px; }

        @media (prefers-color-scheme: dark) {
            body { background: linear-gradient(180deg, #0b1220 0%, #101a2e 55%, #16233d 100%); }
            .card { background: #182338; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45); }
            .rail { stroke: #29b6f6; }
            .cart circle:nth-child(2), .cart circle:nth-child(3) { fill: #0b1220; }
            .title { color: #f1f5fb; }
            .message { color: #a7b4c9; }
            .footer { color: #6b7994; }
        }

        @media (max-width: 480px) {
            .card { padding: 34px 24px 28px; border-radius: 18px; }
            .title { font-size: 22px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .cart { animation: none; offset-distance: 35%; }
        }
    </style>
</head>
<body>
    <div class="card">
        <svg class="logo" viewBox="0 0 34 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
            <path fill="#5D87D5" d="M30.9,12v14.6L26.3,32l-9.6-5.4l-9.5,5l-4.4-5V12c0-6.6,6.2-12,14-12C24.5,0,30.9,5.4,30.9,12z"/>
            <path fill="#4767A3" d="M16.7,0v26.6l-9.5,5l-4.4-5V12C2.7,5.4,9,0,16.7,0z"/>
            <polygon fill="#28343A" points="13.8,24.3 9.5,26.5 7.3,24.2 "/>
            <polygon fill="#4767A3" points="2.1,13.3 2.1,21.5 0,17.2 0,7.9 "/>
            <polygon fill="#5D87D5" points="31.5,13.3 31.5,21.5 33.6,17.2 33.6,7.9 "/>
            <polygon fill="#FFCD61" points="19.3,11 16.7,9.6 14.1,11.1 14.6,7.9 12.4,5.7 15.4,5.2 16.7,2.4 18,5.2 20.9,5.7 18.8,7.9 "/>
            <polygon fill="#28343A" points="19.6,24.3 23.8,26.5 26.1,24.2 "/>
            <polygon fill="#FFCD61" points="26.4,19.4 23.8,17.9 21.2,19.4 21.7,16.3 19.6,14.1 22.5,13.6 23.8,10.7 25.1,13.6 28,14 25.9,16.3 "/>
            <polygon fill="#FFCD61" points="12.2,19.7 9.6,18.3 7,19.8 7.5,16.6 5.3,14.4 8.3,13.9 9.6,11.1 10.9,13.9 13.8,14.4 11.7,16.6 "/>
        </svg>
        <svg class="track" viewBox="0 0 380 130" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
            <path class="rail" d="M8,92 C60,18 118,18 168,80 C205,124 245,124 282,72 C312,32 344,32 372,58" />
            <g class="cart">
                <circle r="8" />
                <circle r="3" cx="-6" cy="7" />
                <circle r="3" cx="6" cy="7" />
            </g>
        </svg>
        <h1 class="title">Please Remain Seated</h1>
        <p class="message">We're experiencing a brief technical stop — we'll be dispatching again shortly.</p>
        <p class="footer">Thanks for your patience!</p>
    </div>
    <script>setTimeout(() => location.reload(), 30000);</script>
</body>
</html>
