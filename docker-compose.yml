name: captain-coaster

services:
    db:
        image: mariadb:11.8
        container_name: db-captain
        volumes:
            - datamaria:/var/lib/mysql
        restart: always
        ports:
            - '3306:3306'
        environment:
            - MYSQL_ROOT_PASSWORD=root123
            - MARIADB_AUTO_UPGRADE=1
    redis:
        image: 'redis:alpine'
        container_name: redis-captain
        restart: always
        ports:
            - '6379:6379'
    adminer:
        image: adminer:latest
        container_name: adminer-captain
        restart: always
        ports:
            - '8081:8080'
volumes:
    # Explicit name, decoupled from the Compose project and the directory.
    # Without it the volume is prefixed with the project name, so every worktree
    # that ran `docker compose up` silently created its own database.
    datamaria:
        name: captain_data
