<!DOCTYPE html>
<!--
  Source of /maintenance.html. Edit this file, then run `npm run build:maintenance`:
  it inlines the site fonts and writes the self-contained copy that deploy.sh
  drops into public/. While it is up, nginx answers every URL with this page
  (503) except /favicon.ico, so the page cannot load anything else.
-->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#F3F6FB">
    <title>Technical stop • Captain Coaster</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <noscript><meta http-equiv="refresh" content="30"></noscript>
    <style>
        @font-face {
            font-family: "Source Sans 3";
            src: url("../fonts/source-sans-3-latin.woff2") format("woff2");
            font-weight: 200 900;
        }

        @font-face {
            font-family: "Barlow Condensed";
            src: url("../fonts/barlow-condensed-600-latin.woff2") format("woff2");
            font-weight: 600;
        }

        /* Values mirror assets/styles/tokens.css. */
        :root {
            --bg: #F3F6FB;
            --surface: #FFFFFF;
            --fg: #182B3A;
            --muted-strong: #405467;
            --action: #2359AD;
            --selected: #EAF1FC;
            --highlight: #FFCD61;
            --success: #23634E;
            --logo-ink: #28343A;
            --shadow-raised: 0 4px 16px rgb(24 43 58 / .09);
            --ease-out: cubic-bezier(.16, 1, .3, 1);
            --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
            --body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;

            color-scheme: light;
            accent-color: var(--action);
            caret-color: var(--action);
        }

        *, *::before, *::after { box-sizing: border-box; }

        ::selection { background: var(--selected); color: var(--fg); }

        html { -webkit-text-size-adjust: 100%; }

        body {
            margin: 0;
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding:
                max(1.5rem, env(safe-area-inset-top))
                max(1.25rem, env(safe-area-inset-right))
                max(1.5rem, env(safe-area-inset-bottom))
                max(1.25rem, env(safe-area-inset-left));
            background: var(--bg);
            color: var(--fg);
            font: 400 1rem/1.5 var(--body);
        }

        main {
            width: 100%;
            max-width: 30rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            display: block;
            height: 1.75rem;
            width: auto;
            margin-bottom: 2rem;
            color: var(--logo-ink);
        }

        /* The closure sign: a white panel in a heavy ink frame. */
        .sign {
            position: relative;
            z-index: 1;
            width: 100%;
            background: var(--surface);
            border: 3px solid var(--fg);
            border-radius: .75rem;
            box-shadow: var(--shadow-raised);
            overflow: hidden;
        }

        .sign__body { padding: 1.75rem 1.5rem 1.5rem; }

        h1 {
            margin: 0 0 1rem;
            font: 600 clamp(3rem, 2.2rem + 4vw, 4.25rem)/1.08 var(--display);
            letter-spacing: -.01em;
            text-wrap: balance;
        }

        .announcement {
            margin: 0;
            max-width: 32ch;
            font-size: 1.25rem;
            color: var(--muted-strong);
            text-wrap: pretty;
        }

        /* Live status strip along the bottom of the sign. */
        .status {
            display: flex;
            align-items: center;
            min-height: 3.5rem;
            padding: .75rem 1.5rem;
            border-top: 3px solid var(--fg);
            background: var(--highlight);
            color: var(--fg);
            transition: background-color .4s var(--ease-out), color .4s var(--ease-out);
        }

        .status__state {
            display: flex;
            align-items: center;
            gap: .625rem;
            margin: 0;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .status__dot {
            flex: none;
            width: .625rem;
            height: .625rem;
            border-radius: 50%;
            background: currentColor;
        }

        .status[data-state="waiting"] .status__dot,
        .status[data-state="checking"] .status__dot {
            animation: pulse 1.6s var(--ease-out) infinite;
        }

        .status[data-state="back"] {
            background: var(--success);
            color: var(--surface);
        }

        /* Two posts carry the sign; the queue chain hangs between them. */
        .barrier {
            display: block;
            width: 100%;
            height: auto;
            margin-top: -3px;
            overflow: visible;
        }

        .barrier__post { fill: var(--fg); }
        .barrier__ring { fill: none; stroke: var(--fg); stroke-width: 4; }
        .barrier__chain { fill: none; stroke-width: 7; stroke-linecap: round; stroke-dasharray: 10 10; }
        .barrier__chain--sun { stroke: var(--highlight); }
        .barrier__chain--ink { stroke: var(--fg); stroke-dashoffset: 10; }

        .thanks {
            margin: 1.5rem 0 0;
            text-wrap: balance;
            color: var(--muted-strong);
            text-align: center;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip-path: inset(50%);
            white-space: nowrap;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgb(24 43 58 / .45); }
            100% { box-shadow: 0 0 0 .6rem rgb(24 43 58 / 0); }
        }

        @media (width >= 40rem) {
            .logo { height: 2rem; margin-bottom: 2.5rem; }
            .sign__body { padding: 2.25rem 2.25rem 2rem; }
            .status { padding-left: 2.25rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            .status__dot { animation: none !important; }
        }
    </style>
</head>
<body>
<main>
    <svg class="logo" viewBox="0 0 220.3 32" width="220" height="32" role="img" aria-label="Captain Coaster">
        {{ logo }}
    </svg>

    <section class="sign" aria-labelledby="title">
        <div class="sign__body">
            <h1 id="title" data-t="title">Please remain seated</h1>
            <p class="announcement" data-t="announcement">Captain Coaster is on a short technical stop while we install an update. We’ll be dispatching again in a few minutes.</p>
        </div>
        <div class="status" data-state="waiting">
            <p class="status__state">
                <span class="status__dot" aria-hidden="true"></span>
                <span class="status__text" aria-hidden="true" data-t="waiting">Next check in 10 s</span>
            </p>
        </div>
    </section>

    <svg class="barrier" viewBox="0 0 480 120" aria-hidden="true" focusable="false" preserveAspectRatio="xMidYMin meet">
        <g class="barrier__post">
            <rect x="12" y="0" width="12" height="108" rx="3"/>
            <rect x="456" y="0" width="12" height="108" rx="3"/>
            <rect x="2" y="108" width="32" height="8" rx="4"/>
            <rect x="446" y="108" width="32" height="8" rx="4"/>
        </g>
        <path class="barrier__chain barrier__chain--sun" d="M18 46 Q240 104 462 46"><animate attributeName="d" to="M18 46 Q18 112 400 110" dur=".9s" begin="indefinite" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".5 0 .2 1"/></path>
        <path class="barrier__chain barrier__chain--ink" d="M18 46 Q240 104 462 46"><animate attributeName="d" to="M18 46 Q18 112 400 110" dur=".9s" begin="indefinite" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".5 0 .2 1"/></path>
        <g class="barrier__ring">
            <rect x="9" y="39" width="18" height="14" rx="4"/>
            <rect x="453" y="39" width="18" height="14" rx="4"/>
        </g>
    </svg>

    <p class="thanks" data-t="thanks">Thanks for your patience. This page reloads by itself as soon as we reopen.</p>

    <p class="sr-only" role="status" aria-live="polite" data-live></p>
</main>

<script>
(() => {
    const INTERVAL = 10;

    const messages = {
        en: {
            doc: 'Technical stop • Captain Coaster',
            title: 'Please remain seated',
            announcement: 'Captain Coaster is on a short technical stop while we install an update. We’ll be dispatching again in a few minutes.',
            waiting: 'Next check in {s} s',
            checking: 'Checking the track…',
            offline: 'You’re offline. We’ll check again once you’re connected.',
            back: 'Back in service. Boarding…',
            thanks: 'Thanks for your patience. This page reloads by itself as soon as we reopen.',
        },
        fr: {
            doc: 'Arrêt technique • Captain Coaster',
            title: 'Veuillez rester assis',
            announcement: 'Captain Coaster fait un court arrêt technique, le temps d’installer une mise à jour. Les départs reprennent dans quelques minutes.',
            waiting: 'Prochaine vérification dans {s} s',
            checking: 'Vérification de la voie…',
            offline: 'Tu es hors ligne. On revérifie dès que tu es reconnecté.',
            back: 'C’est reparti. Embarquement…',
            thanks: 'Merci pour ta patience. Cette page se recharge toute seule dès la réouverture.',
        },
        es: {
            doc: 'Parada técnica • Captain Coaster',
            title: 'Permanezcan sentados',
            announcement: 'Captain Coaster está en una breve parada técnica mientras instalamos una actualización. Volveremos a despachar en unos minutos.',
            waiting: 'Próxima comprobación en {s} s',
            checking: 'Revisando la vía…',
            offline: 'Estás sin conexión. Volveremos a comprobar cuando te conectes.',
            back: 'Volvemos a funcionar. Embarcando…',
            thanks: 'Gracias por tu paciencia. Esta página se recarga sola en cuanto reabramos.',
        },
        de: {
            doc: 'Technischer Stopp • Captain Coaster',
            title: 'Bitte sitzen bleiben',
            announcement: 'Captain Coaster legt einen kurzen technischen Stopp ein, während wir ein Update aufspielen. In wenigen Minuten geht es weiter.',
            waiting: 'Nächste Prüfung in {s} s',
            checking: 'Strecke wird geprüft…',
            offline: 'Du bist offline. Wir prüfen erneut, sobald du wieder verbunden bist.',
            back: 'Es geht weiter. Einsteigen…',
            thanks: 'Danke für deine Geduld. Diese Seite lädt sich von selbst neu, sobald wir wieder öffnen.',
        },
    };

    // Language of the page the visitor asked for (/fr/...), then the browser's.
    const fromPath = location.pathname.match(/^\/(en|fr|es|de)(\/|$)/);
    const fromBrowser = (navigator.languages || [navigator.language || ''])
        .map((l) => l.slice(0, 2).toLowerCase())
        .find((l) => l in messages);
    const lang = fromPath ? fromPath[1] : fromBrowser || 'en';
    const t = messages[lang];

    document.documentElement.lang = lang;
    document.title = t.doc;
    document.querySelectorAll('[data-t]').forEach((el) => {
        const text = t[el.dataset.t];
        if (text) el.textContent = text.replace('{s}', INTERVAL);
    });

    const status = document.querySelector('.status');
    const text = status.querySelector('.status__text');
    const live = document.querySelector('[data-live]');
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

    let remaining = INTERVAL;
    let timer;
    let checking = false;

    const show = (state, message) => {
        status.dataset.state = state;
        text.textContent = message;
    };

    const tick = () => {
        if (!navigator.onLine) {
            if (status.dataset.state !== 'offline') live.textContent = t.offline;
            show('offline', t.offline);
            return;
        }
        remaining -= 1;
        if (remaining <= 0) {
            check();
        } else {
            show('waiting', t.waiting.replace('{s}', remaining));
        }
    };

    const schedule = () => {
        clearInterval(timer);
        remaining = INTERVAL;
        show('waiting', t.waiting.replace('{s}', remaining));
        timer = setInterval(tick, 1000);
    };

    // nginx answers 503 for every URL while maintenance is on: anything else
    // below 500 means the site is back (a 502 during PHP-FPM's reload is not).
    async function check() {
        if (checking) return;
        checking = true;
        clearInterval(timer);
        show('checking', t.checking);

        let back = false;
        try {
            const response = await fetch(location.href, {
                method: 'HEAD',
                cache: 'no-store',
                credentials: 'same-origin',
            });
            back = response.status < 500;
        } catch {
            back = false;
        }

        checking = false;

        if (back) {
            show('back', t.back);
            // The queue chain unhooks from the right post and drops to the floor.
            document.querySelectorAll('.barrier animate').forEach((a) => {
                if (reduceMotion) a.parentElement.setAttribute('d', a.getAttribute('to'));
                else a.beginElement();
            });
            live.textContent = t.back;
            // replace(), not reload(): a form POST that hit the 503 must not be re-sent.
            setTimeout(() => location.replace(location.href), reduceMotion ? 300 : 1200);
            return;
        }
        schedule();
    }

    addEventListener('online', () => check());
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') check();
    });

    schedule();
})();
</script>
</body>
</html>
