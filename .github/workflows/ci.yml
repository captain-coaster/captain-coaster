name: 'CI'

on:
    pull_request:
    push:
        branches:
            - main

jobs:
    quality:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  extensions: redis, xsl

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer dependencies
              uses: actions/cache@v6
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                  restore-keys: ${{ runner.os }}-composer-

            - name: Lint Composer config
              run: composer validate --strict

            - name: Install Composer dependencies
              run: composer install --no-interaction --prefer-dist --no-progress

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install npm dependencies
              run: npm ci

            - name: Build frontend assets
              run: npm run build

            - name: Hand the frontend build to the publish job
              if: github.event_name == 'push'
              uses: actions/upload-artifact@v7
              with:
                  name: frontend-build
                  path: public/build
                  if-no-files-found: error
                  retention-days: 1

            - name: Check CSS contract (no deprecated Bootstrap classes)
              run: npm run check:css-contract

            - name: Run PHPUnit tests
              run: vendor/bin/phpunit

            - name: PHPStan
              run: vendor/bin/phpstan analyse

            - name: PHP-CS-Fixer
              # php-cs-fixer v3.95.15
              uses: docker://oskarstark/php-cs-fixer-ga@sha256:d4b207b4bcfd325c30d7ccd6482f92dc96911e882f55b91556c039564436c9df
              with:
                  args: --diff --dry-run

            - name: Lint Twig templates
              run: ./bin/console lint:twig templates --env=prod

            - name: Check all used icons are locked and committed
              run: |
                  ./bin/console ux:icons:lock
                  if [ -n "$(git status --porcelain -- assets/icons)" ]; then
                      echo "::error::An icon used in a template isn't committed under assets/icons/. Run 'php bin/console ux:icons:lock' locally and commit the result -- otherwise it falls back to a live api.iconify.design call in production."
                      git status --porcelain -- assets/icons
                      exit 1
                  fi

            - name: Check icon sets (Lucide only, plus listed exceptions)
              run: npm run check:icon-sets

            - name: Lint Parameters and Services
              run: ./bin/console lint:container --no-debug

            - name: Lint Doctrine entities
              run: ./bin/console doctrine:schema:validate --skip-sync -vvv --no-interaction

            - name: Check if any dependencies are compromised
              run: composer audit --abandoned=ignore

    # Deploys pull this build instead of running Vite (#400): one version per
    # commit on main, tagged with its SHA, so a rollback finds its own build.
    publish-frontend-build:
        if: github.event_name == 'push'
        needs: quality
        runs-on: ubuntu-latest
        permissions:
            packages: write
        env:
            IMAGE: ghcr.io/captain-coaster/frontend-build
        steps:
            - uses: actions/download-artifact@v8
              with:
                  name: frontend-build
                  path: build

            - uses: oras-project/setup-oras@v2

            - name: Push the build to GitHub Packages
              run: |
                  tar -czf frontend-build.tar.gz -C build .
                  echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io --username "${{ github.actor }}" --password-stdin
                  oras push "$IMAGE:$GITHUB_SHA" \
                      --artifact-type application/vnd.captain-coaster.frontend-build \
                      --annotation "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
                      frontend-build.tar.gz

            - name: Keep the last 20 builds
              uses: actions/delete-package-versions@v5
              with:
                  package-name: frontend-build
                  package-type: container
                  min-versions-to-keep: 20
