version: 2
updates:
    - package-ecosystem: 'composer'
      directory: '/'
      schedule:
          interval: 'weekly'
      open-pull-requests-limit: 0

    - package-ecosystem: 'npm'
      directory: '/'
      schedule:
          interval: 'weekly'
      open-pull-requests-limit: 0

    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'weekly'
      open-pull-requests-limit: 0

    - package-ecosystem: 'docker'
      directory: '/docker/php'
      schedule:
          interval: 'weekly'
      open-pull-requests-limit: 0
